<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De Geheime Spreukenmissie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="fog"></div>
    <div class="stars" aria-hidden="true"></div>

    <main class="card">
      <section class="hero-row">
        <header class="title-banner ritual-column">
          <div class="title-medallion">
            <img class="title-image" src="title.png" alt="De Geheime Spreukenmissie" />
          </div>
        </header>

        <article class="ritual-column glass-column hourglass-panel">
          <section class="hourglass-wrap" aria-label="Aftellende zandloper">
            <div class="hourglass" id="hourglass">
              <img class="hourglass-image" src="zandloper.png" alt="Zandloper" />
              <div class="sand-bulb sand-bulb-top">
                <div class="sand top-sand" id="topSand"></div>
              </div>
              <div class="sand-stream" id="sandStream"></div>
              <div class="sand-bulb sand-bulb-bottom">
                <div class="sand bottom-sand" id="bottomSand"></div>
              </div>
            </div>
          </section>
        </article>
      </section>

      <article class="ritual-column info-column">
        <p class="timer-label">Tijd tot de magische code</p>
        <div class="countdown" id="countdown">--:--:--</div>

        <section class="code-box hidden" id="codeBox" aria-live="polite">
          <p class="code-label">Geheime code:</p>
          <p class="code" id="secretCode"></p>
        </section>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
